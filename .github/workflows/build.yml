name: Build toDus APK (armeabi-v7a)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK (armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate wrapper (repo ships only gradle-wrapper.properties)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build debug APK (armeabi-v7a)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (armeabi-v7a)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: todus-debug-armeabi-v7a
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: todus-release-armeabi-v7a
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
